<!doctype html>
<html lang="ru">
  <head>
    <link rel="icon" type="image/x-icon" href="/icons/icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Mebbnu</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="app-layout">
      <nav class="top-nav">
        <ul class="calendar-menu" id="calendarMenu"></ul>
      </nav>
      <h2 class="training-title">СИЛОВАЯ</h2>
      <div class="meal-container" id="mealContainer">
        <!-- Карточки будут созданы здесь автоматически через JS -->
      </div>
      <nav class="bottom-nav">
        <ul class="buttons-menu" id="buttonsMenu">
          <li>
            <a href="#" class="nav-tab active" data-target="timer">
              <img src="icons/clock.svg" alt="Timer" class="tab-icon" />
            </a>
          </li>
          <li>
            <a href="#" class="nav-tab" data-target="analytics">
              <img src="icons/stats.svg" alt="Analytics" class="tab-icon" />
            </a>
          </li>
          <li>
            <a href="#" class="nav-tab" data-target="settings">
              <img src="icons/settings.svg" alt="Settings" class="tab-icon" />
            </a>
          </li>
        </ul>
      </nav>
    </div>
    <script src="js/app.js" type="module"></script>
  </body>
</html>
